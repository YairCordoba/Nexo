<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Nexo Noticias</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <header>
        <div class="navbar">
            <a href="../../index.html" class="logo"><span class="logo-main">POLITÉCNICO</span></a>
            <nav aria-label="Navegación principal">
                <ul class="nav-links" id="navLinks">
                    <li><a href="../../index.html">Inicio</a></li>
                    <li><a href="noticias.html">Noticias</a></li>
                    <li><a href="noticias.html?categoria=todas">Categorías</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <button class="nav-toggle" id="navToggle" type="button" aria-label="Abrir menú"
                    aria-expanded="false"></button>
                <a href="noticias.html" class="btn btn-primary">Explorar</a>
            </div>
        </div>
    </header>

    <main class="page-admin">
        <section class="page-intro" aria-labelledby="adminTitle">
            <span class="kicker">Gestión / Administración</span>
            <h1 id="adminTitle">Panel de noticias</h1>
            <p class="page-subtitle">Gestiona publicaciones y estados editoriales desde un único lugar.</p>
        </section>

        <section class="admin-stats" aria-label="Resumen editorial">
            <div class="admin-stat"><strong id="statPublished">0</strong><span>Publicadas</span></div>
            <div class="admin-stat"><strong id="statDrafts">0</strong><span>Borradores</span></div>
            <div class="admin-stat"><strong id="statReview">0</strong><span>Pendientes</span></div>
        </section>

        <section aria-labelledby="publicationsTitle">
            <div class="section-heading">
                <h2 id="publicationsTitle">Últimas publicaciones</h2>
            </div>
            <div id="listaAdmin" class="admin-list" aria-live="polite"></div>
        </section>

        <button type="button" class="btn btn-primary" id="btnNuevaNoticia" style="margin-top: 36px; width: 150px;">Nueva
            noticia</button>

        <section id="formAdminPanel" class="admin-form-panel" hidden aria-labelledby="formAdminTitle">
            <h2 id="formAdminTitle" style="font-size: 20px; margin-bottom: 18px;">Crear noticia</h2>
            <form id="formAdmin">
                <input type="hidden" id="noticiaId" value="">
                <div class="admin-form-grid">
                    <div class="form-group"><label for="titulo" class="form-label">Título</label><input type="text"
                            id="titulo" class="form-control" required></div>
                    <div class="form-group"><label for="categoria" class="form-label">Categoría</label><select
                            id="categoria" class="form-control" required>
                            <option>Educación</option>
                            <option>Tecnología</option>
                            <option>Turismo</option>
                            <option>Comercio</option>
                        </select></div>
                    <div class="form-group"><label for="autor" class="form-label">Autor</label><input type="text"
                            id="autor" class="form-control" required></div>
                    <div class="form-group"><label for="imagen" class="form-label">URL de imagen
                            (opcional)</label><input type="text" id="imagen" class="form-control"></div>
                    <div class="form-group form-group--wide"><label for="resumen"
                            class="form-label">Resumen</label><textarea id="resumen" class="form-control"
                            required></textarea></div>
                    <div class="form-group form-group--wide"><label for="contenido" class="form-label">Contenido
                            completo</label><textarea id="contenido" class="form-control" required></textarea></div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 14px;"><button type="submit" class="btn btn-primary"
                        id="btnSubmitAdmin">Guardar</button><button type="button" class="btn btn-outline"
                        id="btnCancelarEdicion">Cancelar</button></div>
            </form>
        </section>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/favoritos.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
