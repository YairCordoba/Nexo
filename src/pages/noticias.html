<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias - Nexo Noticias</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="../../index.html" class="logo">
                <span class="logo-main">NEXO</span>
                <span class="logo-sub">Noticias.</span>
            </a>
            
            <nav>
                <ul class="nav-links" id="navLinks">
                    <li><a href="../../index.html">Inicio</a></li>
                    <li><a href="noticias.html" class="active">Noticias</a></li>
                    <li><a href="favoritos.html">Favoritos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            
            <div class="nav-actions">
                <button class="nav-toggle" id="navToggle">☰</button>
                <span style="font-size: 1.2rem; cursor: pointer;">🔍</span>
                <span style="font-size: 1.2rem; cursor: pointer;">🌙</span>
                <a href="contacto.html" class="btn btn-primary" style="margin-left: 1rem;">Contact →</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" style="padding-top: 3rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--color-primary); padding-bottom: 1rem; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                <h1 style="font-size: 3rem; margin: 0; line-height: 1;">Todas las Noticias</h1>
                
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div style="position: relative;">
                        <input type="text" id="inputBusqueda" class="form-control" placeholder="Search articles..." style="padding-left: 2.5rem; border-radius: 40px;">
                        <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--color-text-light);">🔍</span>
                    </div>
                </div>
            </div>
            
            <!-- Herramientas de filtrado -->
            <div style="margin-bottom: 3rem;">
                <div class="categories-list" id="filtrosCategoria" style="justify-content: flex-start;">
                    <button class="category-tag active" data-categoria="Todas">Todas</button>
                    <button class="category-tag" data-categoria="Educación">Educación</button>
                    <button class="category-tag" data-categoria="Tecnología">Tecnología</button>
                    <button class="category-tag" data-categoria="Turismo">Turismo</button>
                    <button class="category-tag" data-categoria="Comercio">Comercio</button>
                </div>
            </div>

            <!-- Contenedor Grid -->
            <div class="grid grid-cols-3" id="contenedorNoticias">
                <!-- JS inyectará las tarjetas aquí -->
            </div>
            
            <div id="mensajeVacio" style="display: none; text-align: center; padding: 4rem; background: #fafafa; border: 1px dashed var(--color-border); border-radius: 4px; margin-top: 2rem;">
                <h3 style="font-size: 1.5rem; margin-bottom: 1rem;">No se encontraron noticias</h3>
                <p style="color: var(--color-text-light);">No hay artículos que coincidan con tu búsqueda. Intenta con otros términos.</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top: none;">
                <p>&copy; 2026 Nexo Noticias. Proyecto Académico.</p>
                <p>Designed for Quietly Thinking</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/utils.js"></script>
    <script src="../js/favoritos.js"></script>
    <script src="../js/noticias.js"></script>
    <!-- Incluir app.js para habilitar el easter egg en todas las páginas -->
    <script src="../js/app.js"></script>
</body>
</html>
